<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_settings.get('site_name') or 'Lighting Control' }} — Terms of Service</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent:     #e94560;
            --bg:         #07091a;
            --surface:    rgba(14, 20, 48, 0.82);
            --border-dim: rgba(255, 255, 255, 0.07);
            --text:       #dde0f0;
            --text-dim:   #6e7090;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: 14px;
            padding: 1.5rem;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); text-align: center; }
        p { font-size: 0.9rem; line-height: 1.55; }
        a { color: var(--accent); }
        .error {
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            border: 1px solid var(--accent);
            color: #f5a0b0;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            text-align: center;
        }
        label { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.9rem; line-height: 1.4; cursor: pointer; }
        input[type="checkbox"] { width: 1.25rem; height: 1.25rem; margin-top: 0.1rem; flex: none; accent-color: var(--accent); }
        button {
            background: var(--accent);
            border: 0;
            border-radius: 7px;
            color: #fff;
            font: inherit;
            font-weight: 700;
            padding: 0.7rem;
            cursor: pointer;
        }
        .meta { color: var(--text-dim); font-size: 0.78rem; text-align: center; }
    </style>
</head>
<body style="{% if site_settings.get('accent_color') %}--accent: {{ site_settings.accent_color | e }}; {% endif %}{% if site_settings.get('text_color') %}--text: {{ site_settings.text_color | e }};{% endif %}">
    <form class="card" method="post" action="{{ url_for('auth.accept_terms') }}">
        <h1>Terms of Service</h1>
        <p>Before you continue, please review the Software Terms of Service for this controller.</p>
        <p><a href="{{ url_for('main.terms') }}" target="_blank" rel="noopener">Read the Terms of Service</a></p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label>
            <input type="checkbox" name="agree" value="1">
            <span>I have read and agree to the Terms of Service.</span>
        </label>
        <button type="submit">Agree and Continue</button>
        <div class="meta">Terms version {{ terms_version }}. You will be asked again only if the Terms change.</div>
    </form>
</body>
</html>
