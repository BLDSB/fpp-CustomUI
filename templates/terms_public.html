<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Service</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent:     #e94560;
            --bg:         #07091a;
            --surface:    rgba(14, 20, 48, 0.82);
            --border-dim: rgba(255, 255, 255, 0.07);
            --text:       #dde0f0;
            --text-dim:   #6e7090;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 1rem;
        }
    </style>
</head>
<body style="{% if site_settings.get('accent_color') %}--accent: {{ site_settings.accent_color | e }}; {% endif %}{% if site_settings.get('text_color') %}--text: {{ site_settings.text_color | e }};{% endif %}">
    {% set back_url = url_for('auth.login') %}
    {% set back_label = 'Back' %}
    {% include "_terms_body.html" %}
</body>
</html>
