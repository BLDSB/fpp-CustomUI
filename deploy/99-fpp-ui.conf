# Apache2 reverse proxy: /__UI_PATH__ → Flask app on port 5000
#
# This file is a TEMPLATE. The placeholder below is substituted with the
# install's configured path (UI_PATH in .env, default "CustomUI") when the
# rendered copy is written to /etc/apache2/conf-enabled/99-fpp-ui.conf.
#
# Do not edit the installed copy directly — it is regenerated on every upgrade.
# To change the path:
#   sudo fpp-ui-set-path <name>
# or use the Settings page in the UI.

<IfModule mod_proxy.c>
    ProxyRequests Off

    # Redirect /__UI_PATH__ (no trailing slash) so links resolve correctly.
    RedirectMatch permanent ^/__UI_PATH__$ /__UI_PATH__/

    <Location "/__UI_PATH__/">
        # Tell Flask the original prefix so url_for() generates correct links.
        RequestHeader set X-Forwarded-Prefix "/__UI_PATH__"

        ProxyPass "http://127.0.0.1:5000/"
        ProxyPassReverse "http://127.0.0.1:5000/"

        # Allow access from all network devices (Flask enforces its own login).
        Require all granted
    </Location>
</IfModule>
